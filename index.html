    <!-- Tailwind CSS for rapid styling -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0A1128',

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
    
    <!-- GSAP for Preloader & Scroll Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0A1128;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* High-tech grid background for light theme */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(10, 17, 40, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 17, 40, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Core Typography Styles */
        .sport-title { font-weight: 900; font-style: italic; text-transform: uppercase; line-height: 0.9; letter-spacing: -0.02em; }
        
        /* The Eclipse Preloader */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0A1128; z-index: 9999; display: flex; justify-content: center; align-items: center;
            clip-path: circle(150% at 50% 50%);
        }
        .logo-grid { position: relative; width: 100px; height: 100px; }
        .dot { position: absolute; width: 26px; height: 26px; border-radius: 50%; }
        .dot:nth-child(1) { top: 0; left: 0; background: #00A8CC; }
        .dot:nth-child(2) { top: 0; left: 37px; background: #ffffff; }
        .dot:nth-child(3) { top: 0; left: 74px; background: #00A8CC; }
        .dot:nth-child(4) { top: 37px; left: 0; background: #ffffff; }
        .dot:nth-child(5) { top: 37px; left: 37px; background: #00A8CC; }
        .dot:nth-child(6) { top: 37px; left: 74px; background: #ffffff; }
        .dot:nth-child(7) { top: 74px; left: 0; background: #00A8CC; }
        .dot:nth-child(8) { top: 74px; left: 37px; background: #ffffff; }
        .dot:nth-child(9) { top: 74px; left: 74px; background: #00A8CC; }

        /* Angled Elements */
        .skew-box { transform: skewX(-12deg); }
        .un-skew { transform: skewX(12deg); display: inline-block; }

        /* Marquee Animation */
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 20s linear infinite; }

        /* Custom thick borders */
        .brutal-border { border: 4px solid #0A1128; }
        .brutal-shadow { box-shadow: 12px 12px 0px #0A1128; transition: all 0.2s ease; }
        .brutal-shadow:hover { box-shadow: 6px 6px 0px #00A8CC; transform: translate(6px, 6px); }

        /* Forms */
        .brutal-input { border: 4px solid #0A1128; padding: 1rem; width: 100%; font-family: 'Inter', sans-serif; font-weight: 700; font-style: italic; outline: none; transition: border-color 0.3s; }
        .brutal-input:focus { border-color: #00A8CC; }

        /* Layers Menu Overlay */
        #menu-container { position: fixed; top: 76px; left: 0; width: 100%; height: calc(100vh - 76px); z-index: 40; pointer-events: none; overflow: hidden; }
        .menu-layer { position: absolute; top: -100%; left: 0; width: 100%; height: 100%; }
        #menu-layer-1 { background-color: #00A8CC; z-index: 41; }
        #menu-layer-2 { background-color: #0A1128; z-index: 42; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .menu-link { opacity: 0; transform: translateY(40px); pointer-events: auto; }
    </style>
</head>
